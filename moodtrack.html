<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Moodtrack - Buddy</title>
  <link rel="stylesheet" href="css/style.css"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
</head>
<body>

  <header class="moody">
    <button class="back-button" onclick="window.location.href='homepage.html'">← </button>
    <h2>Moodtrack</h2>
   <button id="toggleDark" class="dark-toggle">🌙</button>
  </header>

  <main>
    <h3>Your Mood Over Time</h3>
    <div class="mood-chart">
      <canvas id="moodChart"></canvas>
    </div>
  </main>

  <script src="js/script.js"></script>
  <script>
  // Kept in its own block so these names can't clash with the shared script.js
  {
    // A browser can block localStorage, and then reading it throws instead of giving null
    const read = (key) => {
      try {
        return localStorage.getItem(key);
      } catch {
        return null;
      }
    };

    // Dark mode comes first, so the moon button works even if the chart can't load. The
    // choice is shared with the other pages.
    let moodChart = null;
    const applyDark = (dark) => {
      document.body.classList.toggle('dark', dark);
      if (!moodChart) return;
      const color = dark ? '#fff' : '#333';
      moodChart.options.plugins.legend.labels.color = color;
      moodChart.options.scales.x.ticks.color = color;
      moodChart.options.scales.y.ticks.color = color;
      moodChart.update();
    };
    applyDark(read('darkMode') === 'true');
    document.getElementById('toggleDark')?.addEventListener('click', () => {
      const dark = !document.body.classList.contains('dark');
      applyDark(dark);
      // If the browser can't save the choice (storage full or blocked), the page still switches
      try {
        localStorage.setItem('darkMode', dark);
      } catch (error) {
        console.warn("Couldn't save the dark mode choice:", error);
      }
    });

    // Mood values mapping (convert text moods → numeric)
    const moodValues = {
      "Sad": 1,
      "Unhappy": 2,
      "Neutral": 3,
      "Happy": 4,
      "Joyful": 5,
      "Excited": 5,
      "Angry": 2,
      "Exhausted": 2,
      "Tired": 2,
      "Lost": 2,
      "Calm": 4,
      "Anxious": 2
    };

    // Saved moods from localStorage (an unreadable list counts as empty)
    let moodLogs = [];
    try {
      const saved = JSON.parse(read("checkins"));
      if (Array.isArray(saved)) moodLogs = saved;
    } catch {
      console.warn("The saved check-ins couldn't be read");
    }

    // Sort by date
    moodLogs.sort((a, b) => new Date(a.date) - new Date(b.date));

    // Extract labels (dates) & mood scores
    const labels = moodLogs.map(entry => new Date(entry.date).toLocaleDateString());
    const dataPoints = moodLogs.map(entry => moodValues[entry.mood] || 3);

    // Setup Chart.js. If it couldn't load (no connection, say), the card says so instead.
    try {
      const ctx = document.getElementById('moodChart').getContext('2d');
      moodChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels.length ? labels : ["No data yet"],
        datasets: [{
          label: "Mood Level",
          data: dataPoints.length ? dataPoints : [0],
          backgroundColor: "rgba(139,105,141,0.2)",
          borderColor: "#8b698d",
          borderWidth: 2,
          tension: 0.4,
          pointBackgroundColor: "#8b698d",
          fill: true
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            display: true,
            labels: { color: '#333' }
          }
        },
        scales: {
          y: {
            beginAtZero: true,
            max: 5,
            ticks: { color: '#333' }
          },
          x: {
            ticks: { color: '#333' }
          }
        }
      }
    });
      applyDark(document.body.classList.contains('dark'));
    } catch (error) {
      console.error("Couldn't draw the mood chart:", error);
      document.querySelector('.mood-chart').textContent = "The mood chart couldn't load. Please check your connection and refresh the page.";
    }
  }
  </script>
</body>
</html>
