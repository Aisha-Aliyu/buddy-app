name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check every script parses
        # node --check passes module files (import/export) without really checking them,
        # so those are fed through as modules instead
        run: |
          for f in js/*.js; do
            if grep -qE '^(import|export) ' "$f"; then
              node --input-type=module --check < "$f"
            else
              node --check "$f"
            fi
          done
      - name: Check pages only point at files that exist
        run: python3 .github/scripts/check_links.py
